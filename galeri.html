  <main class="content">
    <p class="tag">KUMPULAN VISUAL</p>
    <h1>Galeri Desain</h1>
    <p>Kumpulan desain poster, ilustrasi anime, dan palet warna yang menjadi inspirasi visual.</p>
    <div class="gallery">
      <figure class="gallery-item">
        <img src="images/palet-warna.jpg" alt="Palet warna Hunyadi Yellow, Auburn, Dark Slate Gray, dan Vanilla" loading="lazy">
        <figcaption><h2>Palet Warna</h2><p>Kombinasi warna hangat dan gelap untuk inspirasi desain.</p></figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/bocchi-the-rock.jpg" alt="Poster ilustrasi Hitori Gotoh dari Bocchi the Rock" loading="lazy">
        <figcaption><h2>Bocchi the Rock</h2><p>Poster karakter dengan tipografi tegas dan tekstur kertas.</p></figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/ryo-yamada-poster.jpg" alt="Poster karakter Ryo Yamada bernuansa biru gelap" loading="lazy">
        <figcaption><h2>Ryo Yamada</h2><p>Desain poster karakter dengan komposisi biru dan abu-abu.</p></figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/sakamoto-days.jpg" alt="Poster Sakamoto Days bergaya komik hitam, merah, dan kuning" loading="lazy">
        <figcaption><h2>Sakamoto Days</h2><p>Gaya komik dengan kontras hitam, merah, dan kuning.</p></figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/poster-integritas.jpg" alt="Poster bertema integritas, dedikasi, dan layanan berkualitas" loading="lazy">
        <figcaption><h2>Poster Integritas</h2><p>Poster edukasi tentang kejujuran, transparansi, dan tanggung jawab.</p></figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/ryo-yamada-gfx.jpg" alt="Desain grafis Ryo Yamada dengan gaya monokrom dan aksen biru" loading="lazy">
        <figcaption><h2>Ryo Yamada GFX</h2><p>Eksperimen desain grafis monokrom dengan aksen biru.</p></figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/canned-drinks.jpg" alt="Poster promosi minuman kaleng dengan ilustrasi anime dan latar biru" loading="lazy">
        <figcaption><h2>Canned Drinks</h2><p>Poster promosi minuman dengan warna cerah dan ilustrasi.</p></figcaption>
      </figure>
    </div>
